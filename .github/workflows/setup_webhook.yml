name: One-time webhook setup (temporary)
on: workflow_dispatch
permissions: {}
jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.NEWS_BOT_TOKEN }}
      CF: ${{ secrets.CF_API_TOKEN }}
      SEC: ${{ secrets.WEBHOOK_SECRET_TMP }}
    steps:
      - name: Put bot token into worker secret
        run: |
          python3 -c "import json,os;print(json.dumps({'name':'NEWS_BOT_TOKEN','text':os.environ['T'],'type':'secret_text'}))" > b.json
          curl -sf -X PUT -H "Authorization: Bearer $CF" -H "content-type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/c85d54bb2b5d061be7bac87bd61074b7/workers/scripts/news-bot-webhook/secrets" --data @b.json -o /dev/null && echo worker-secret-ok; rm b.json
      - name: Set Telegram webhook
        run: curl -s "https://api.telegram.org/bot$T/setWebhook" -d url=https://news-bot-webhook.kourosh-gold.workers.dev -d secret_token=$SEC -d 'allowed_updates=["message","edited_message"]' | grep -o '"ok":[a-z]*'
